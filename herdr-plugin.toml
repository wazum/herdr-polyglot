id = "wazum.polyglot"
name = "polyglot"
version = "0.2.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Write agent prompts in your own language and have them delivered translated."

[[build]]
command = ["bash", "herdr/install.sh"]

# Run the binary once when the server starts, so the keypress that opens the
# popup does not wait for the operating system to page it in for the first time.
[[startup]]
command = ["sh", "-c", "\"$HERDR_PLUGIN_ROOT/bin/herdr-polyglot\" warm"]

# `polyglot open` puts the overlay in a floating popup over the pane the keybinding
# was pressed in and passes that pane along as HERDR_POLYGLOT_TARGET, so the prompt
# lands where it was written. Everything else comes from the environment or the
# plugin's .env, never from argv.
[[panes]]
id = "overlay"
title = "polyglot"
placement = "overlay"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-polyglot\""]

[[actions]]
id = "prompt"
title = "polyglot: write and send a prompt"
contexts = ["pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-polyglot\" open"]

[[actions]]
id = "compose"
title = "polyglot: write a prompt, review before sending"
contexts = ["pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-polyglot\" open --review"]
