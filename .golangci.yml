version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        # Naming is enough; comments are reserved for what code cannot say.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # Bubble Tea's interface takes and returns models by value.
      - path: internal/overlay/
        linters:
          - gocritic
        text: hugeParam
      # Variable names, not secrets; and the paths read are the plugin's own.
      - path: internal/config/config\.go
        linters:
          - gosec
        text: G101|G304
      # Shelling out to the herdr CLI with our own arguments is the whole job.
      - path: internal/herdr/execrunner\.go
        linters:
          - gosec
        text: G204

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wazum/herdr-polyglot
