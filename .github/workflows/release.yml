name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Darwin keeps cgo, so name resolution goes through the system
          # resolver and a VPN or split DNS still finds the translation service.
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: 1
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: 1
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: 0
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go build -trimpath -ldflags "-s -w" -o herdr-polyglot ./cmd/herdr-polyglot
          tar czf "herdr-polyglot_${GOOS}_${GOARCH}.tar.gz" herdr-polyglot
          shasum -a 256 "herdr-polyglot_${GOOS}_${GOARCH}.tar.gz" \
            > "herdr-polyglot_${GOOS}_${GOARCH}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herdr-polyglot_${{ matrix.goos }}_${{ matrix.goarch }}
          path: herdr-polyglot_*.tar.gz*
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes herdr-polyglot_*.tar.gz*
